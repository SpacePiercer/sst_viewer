<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SST Viewer — sign in</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { margin: 0; height: 100vh; display: grid; place-items: center;
         font: 14px system-ui, sans-serif; background: #0d1b2a; color: #e8eef5; }
  form { background: #16293f; padding: 26px 28px; border-radius: 10px;
         box-shadow: 0 6px 30px rgba(0,0,0,.45); width: 260px; }
  h1 { font-size: 18px; margin: 0 0 2px; }
  p.sub { margin: 0 0 18px; color: #8fa6bd; font-size: 12px; }
  label { display: block; font-size: 12px; color: #8fa6bd; margin-top: 12px; }
  input { width: 100%; box-sizing: border-box; padding: 7px 9px; margin-top: 3px;
          border: 1px solid #2b4463; border-radius: 5px; background: #0d1b2a;
          color: #e8eef5; font-size: 14px; }
  button { width: 100%; margin-top: 18px; padding: 8px; border: 0; border-radius: 5px;
           background: #2f7fd1; color: #fff; font-size: 14px; cursor: pointer; }
  button:disabled { opacity: .6; cursor: default; }
  #err { min-height: 16px; margin-top: 10px; color: #ff8f8f; font-size: 12px; }
</style>
</head>
<body>
<form id="f" autocomplete="on">
  <h1>SST Viewer</h1>
  <p class="sub">Okhotsk Sea · sea-surface temperature</p>
  <label>User name<input id="u" name="username" autocomplete="username" autofocus></label>
  <label>Password<input id="p" name="password" type="password" autocomplete="current-password"></label>
  <button id="b" type="submit">Sign in</button>
  <div id="err"></div>
</form>
<script>
document.getElementById("f").addEventListener("submit", async e => {
  e.preventDefault();
  const b = document.getElementById("b"), err = document.getElementById("err");
  b.disabled = true; err.textContent = "";
  try {
    const r = await fetch("/api/login", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username: document.getElementById("u").value,
                             password: document.getElementById("p").value }),
    });
    if (r.ok) { location.href = "/"; return; }
    err.textContent = (await r.json()).detail || "sign-in failed";
  } catch (e) { err.textContent = "server not reachable"; }
  b.disabled = false;
});
</script>
</body>
</html>
